name: Inspect LEGO ZIP before import
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lego-import.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image validation dependency
        run: python3 -m pip install --user Pillow
      - name: Download, extract and inventory LEGO archive
        env:
          DROPBOX_ZIP_URL: "https://www.dropbox.com/scl/fi/taodr31hq31ss1c9d967z/Buy-Cross-border-compatible-LEGO-McLaren-F1-Lamborghini-Ferrari-and-Porsche-sports-car-building-block-toy-_-boonbuy-20261106T224631Z-1-001.zip?rlkey=gqkm2qm8i7gy6wdygbuoqoulw&st=bcradhnm&dl=1"
        run: |
          python3 - <<'PY'
          import os, urllib.request, zipfile, pathlib, hashlib
          from PIL import Image, ImageOps, ImageDraw
          url = os.environ["DROPBOX_ZIP_URL"]
          req = urllib.request.Request(url, headers={"User-Agent":"JerseyHub-image-import/1.0"})
          with urllib.request.urlopen(req, timeout=120) as response:
              data = response.read()
              print("Dropbox HTTP:", response.status)
              print("Downloaded bytes:", len(data))
          if not data.startswith(b"PK"):
              raise RuntimeError("Dropbox response is not a ZIP archive.")
          root = pathlib.Path("/tmp/lego-review")
          extracted = root / "images"
          extracted.mkdir(parents=True, exist_ok=True)
          archive_path = "/tmp/lego-gallery.zip"
          pathlib.Path(archive_path).write_bytes(data)
          records = []
          with zipfile.ZipFile(archive_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f"ZIP integrity error: {bad}")
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  name = pathlib.PurePosixPath(item.filename).name
                  suffix = pathlib.Path(name).suffix.lower()
                  if suffix not in {".jpg", ".jpeg", ".png", ".webp"}:
                      print("SKIP non-image:", item.filename)
                      continue
                  payload = archive.read(item)
                  try:
                      import io
                      im = Image.open(io.BytesIO(payload))
                      im.verify()
                      im = Image.open(io.BytesIO(payload))
                      width, height = im.size
                  except Exception as exc:
                      raise RuntimeError(f"Invalid image {item.filename}: {exc}")
                  safe_name = f"{len(records)+1:02d}_{name}"
                  (extracted / safe_name).write_bytes(payload)
                  records.append((safe_name, len(payload), width, height, hashlib.sha256(payload).hexdigest()[:12]))
          if len(records) != 58:
              raise RuntimeError(f"Expected the previously observed 58 images, found {len(records)}.")
          report = root / "inventory.tsv"
          report.write_text("index\tfilename\tbytes\twidth\theight\tsha256_12\n" + "".join(
              f"{i:02d}\t{name}\t{size}\t{w}\t{h}\t{sha}\n"
              for i,(name,size,w,h,sha) in enumerate(records,1)), encoding="utf-8")
          print("Validated image count:", len(records))
          for i,(name,size,w,h,sha) in enumerate(records,1):
              print(f"{i:02d}\t{size}\t{w}x{h}\t{name}")
          # Contact sheet for visual matching; images are not copied into the live gallery.
          cell_w, cell_h, cols = 220, 180, 4
          rows = (len(records)+cols-1)//cols
          sheet = Image.new("RGB", (cols*cell_w, rows*cell_h), "white")
          draw = ImageDraw.Draw(sheet)
          for i,(name,_,_,_,_) in enumerate(records):
              im = Image.open(extracted/name).convert("RGB")
              im.thumbnail((cell_w-12, cell_h-38))
              x, y = (i%cols)*cell_w, (i//cols)*cell_h
              sheet.paste(im, (x+(cell_w-im.width)//2, y+4))
              draw.text((x+6,y+cell_h-28), f"{i+1:02d}  {name[:25]}", fill="black")
          sheet.save(root / "contact-sheet.jpg", quality=88)
          PY
      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: lego-zip-review
          path: /tmp/lego-review/
          if-no-files-found: error
