name: Audit patchs clubs allemands — Bundesliga

on:
  workflow_dispatch:
  push:
    branches: [main, "prep/bundesliga-patch-integration"]
    paths:
      - "scripts/vivi_bundesliga_patch_audit.py"
      - "scripts/build_bundesliga_patch_candidates.py"
      - "scripts/test_bundesliga_patch_candidates.py"
      - ".github/workflows/vivi-bundesliga-patch-audit.yml"

permissions:
  contents: read

concurrency:
  group: vivi-bundesliga-patch-audit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout JerseyHub
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Auditer uniquement les collections des clubs allemands
        run: python scripts/vivi_bundesliga_patch_audit.py

      - name: Construire la bibliothèque de candidats (sans activation)
        run: python scripts/build_bundesliga_patch_candidates.py

      - name: Vérifier les scripts et la sécurité des candidats
        run: |
          python -m py_compile scripts/vivi_bundesliga_patch_audit.py scripts/build_bundesliga_patch_candidates.py scripts/test_bundesliga_patch_candidates.py
          python scripts/test_bundesliga_patch_candidates.py

      - name: Publier les rapports et la bibliothèque de candidats
        uses: actions/upload-artifact@v4
        with:
          name: vivi-bundesliga-patch-integration-prep
          path: |
            VIVI-BUNDESLIGA-PATCH-AUDIT.md
            data/vivi-bundesliga-patch-audit.json
            data/vivi-bundesliga-patch-audit.csv
            data/vivi-bundesliga-patch-candidates.json
            data/vivi-bundesliga-patch-candidates.csv
          if-no-files-found: error
          retention-days: 30
