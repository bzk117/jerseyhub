              }
            ]
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          rows = json.loads(os.environ["MANIFEST"])
          assert len(rows) == 46, f"Expected 46 records, got {len(rows)}"
          root = pathlib.Path("assets/lifestyle/lego-construction")
          root.mkdir(parents=True, exist_ok=True)
          for row in rows:
              filename = f"lego-{row['id']}.jpg"
              target = root / filename
              req = urllib.request.Request(row["url"], headers={"User-Agent":"JerseyHub-image-import/1.0"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
                  content_type = response.headers.get("Content-Type","").lower()
              if not data.startswith(b"\xff\xd8\xff"):
                  raise RuntimeError(f"{filename}: response is not JPEG (Content-Type={content_type}, bytes={len(data)})")
              if len(data) < 500:
                  raise RuntimeError(f"{filename}: suspiciously small image ({len(data)} bytes)")
              target.write_bytes(data)
              print(f"OK {filename}: {len(data)} bytes")
          actual = list(root.glob("lego-*.jpg"))
          if len(actual) < 46:
              raise RuntimeError(f"Only {len(actual)} files present after import")
          print(f"Validated {len(rows)} Dropbox images.")
          PY
