name: Check club crest image URLs
on:
  push:
    branches: [main]
    paths:
      - "club-logos-world.js"
      - ".github/workflows/check-club-logos.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install checker dependency
        run: python -m pip install requests
      - name: Check non-Wikimedia crest URLs
        run: |
          python - <<'PY'
          import re, requests
          from concurrent.futures import ThreadPoolExecutor
          source = open("club-logos-world.js", encoding="utf-8").read()
          entries = re.findall(r'"([^"]+)"\s*:\s*\\{\s*src:\s*"([^"]+)"', source)
          entries = [(name,url) for name,url in entries if "commons.wikimedia.org" not in url]
          print(f"CHECKING {len(entries)} NON-WIKIMEDIA CRESTS")
          def check(item):
              name,url=item
              try:
                  r=requests.get(url,timeout=12,allow_redirects=True,headers={"User-Agent":"Mozilla/5.0 JerseyHub crest checker"})
                  ok=(r.status_code==200 and "image/" in r.headers.get("content-type","").lower())
                  return name,r.status_code,r.headers.get("content-type",""),r.url,ok
              except Exception as e:
                  return name,"ERROR","",str(e),False
          with ThreadPoolExecutor(max_workers=10) as pool:
              results=list(pool.map(check,entries))
          for name,status,ctype,url,ok in results:
              print(("OK  " if ok else "FAIL")+" | "+name+" | "+str(status)+" | "+ctype+" | "+url)
          failed=[x for x in results if x[1] in (404,"ERROR")]
          print(f"\nSUMMARY: {len(results)-len(failed)} accessible / {len(failed)} confirmed 404 or network failures")
          if failed: raise SystemExit(1)
          PY
