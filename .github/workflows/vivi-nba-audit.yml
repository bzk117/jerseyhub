name: Audit Vivi Jersey NBA catalogue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/vivi_nba_audit.py"
      - ".github/workflows/vivi-nba-audit.yml"

permissions:
  contents: write

concurrency:
  group: vivi-nba-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout JerseyHub
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Scan NBA collections and product pages
        run: python scripts/vivi_nba_audit.py

      - name: Upload NBA audit reports
        uses: actions/upload-artifact@v4
        with:
          name: vivi-jersey-nba-audit
          path: |
            VIVI-NBA-AUDIT.md
            data/vivi-nba-audit.json
            data/vivi-nba-audit.csv
          if-no-files-found: error
          retention-days: 30

      - name: Save audit report to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VIVI-NBA-AUDIT.md data/vivi-nba-audit.json data/vivi-nba-audit.csv
          if git diff --cached --quiet; then
            echo "NBA audit report unchanged."
            exit 0
          fi
          git commit -m "Save Vivi Jersey NBA catalogue audit"
          git push origin HEAD:main
