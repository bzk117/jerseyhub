<link rel="stylesheet" href="styles.css">
<style>
.lego-gallery-page{max-width:1500px;margin:0 auto;padding:30px 22px 70px}
.lego-gallery{display:grid;grid-template-columns:72px minmax(360px,1fr) minmax(440px,1.12fr);gap:18px;align-items:start}
.lego-left-thumbs{display:flex;flex-direction:column;gap:12px;max-height:720px;overflow-y:auto;padding:2px 3px}
.lego-main{width:100%;height:min(58vw,680px);min-height:380px;border:1px solid #393939;border-radius:16px;background:#111;display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
.lego-main img{width:78%;height:78%;object-fit:contain;transition:transform .28s ease}
.lego-main:hover img{transform:scale(1.16)}
.lego-left-thumb{width:64px;height:64px;flex:0 0 64px}
.lego-right-options{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;align-content:start;max-height:720px;overflow-y:auto;padding:2px 3px}
.lego-thumb{height:64px;min-width:0;padding:4px;border:1px solid #444;border-radius:9px;background:#191919;cursor:pointer;overflow:hidden}
.lego-thumb img{width:100%;height:100%;object-fit:contain}
.lego-thumb.active,.lego-thumb:hover{border:2px solid #e9bd54}
.lego-admin-cost{display:none;max-width:1120px;margin:18px auto 0;padding:18px 22px;border:1px solid #4b4537;border-radius:12px;background:#121212;color:#f7f7f7}
.lego-admin-cost strong{display:block;font-size:34px;font-weight:900;color:#e9bd54;margin-top:5px}
@media(max-width:1050px){.lego-gallery{grid-template-columns:64px minmax(300px,1fr)}.lego-right-options{grid-column:1/-1;grid-template-columns:repeat(8,minmax(0,1fr));max-height:none}.lego-main{height:520px}}
@media(max-width:650px){.lego-gallery-page{padding:18px 12px 50px}.lego-gallery{grid-template-columns:52px minmax(0,1fr);gap:10px}.lego-left-thumbs{gap:8px}.lego-left-thumb{width:48px;height:48px;flex-basis:48px}.lego-main{height:360px;min-height:260px}.lego-main img{width:82%;height:82%}.lego-right-options{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.lego-thumb{height:58px}}
</style>
</head>

<div>Prix fournisseur</div><strong id="legoAdminPrice">— €</strong>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
document.getElementById('mobileMenu')?.addEventListener('click',()=>document.querySelector('.main-nav')?.classList.toggle('open'));
document.querySelectorAll('.lego-thumb').forEach(btn=>{
 const showImage=()=>{
  document.querySelectorAll('.lego-thumb').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('legoMainImage').src=btn.dataset.image;
 };
 btn.addEventListener('click',showImage);
 if(btn.classList.contains('lego-left-thumb'))btn.addEventListener('mouseenter',showImage);
});
(async()=>{
 const cfg=window.JERSEYHUB_SUPABASE;
 if(!window.supabase||!cfg?.url||!cfg?.anonKey)return;
 const db=window.supabase.createClient(cfg.url,cfg.anonKey);
 const showAdminPrice=async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session)return;
  const {data,error}=await db.from('lego_supplier_cost').select('price_eur').eq('id',1).maybeSingle();
  if(error||!data)return;
  document.getElementById('legoAdminPrice').textContent=data.price_eur===null?'— €':new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'}).format(Number(data.price_eur));
  document.getElementById('legoAdminCost').style.display='block';
 };
 await showAdminPrice();
 db.auth.onAuthStateChange(()=>{showAdminPrice()});
})();
</script>
