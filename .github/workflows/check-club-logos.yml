name: Check club crest image URLs
on:
  push:
    branches: [main]
    paths:
      - "club-logos-world.js"
      - ".github/workflows/check-club-logos.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install checker dependency
        run: python -m pip install requests
      - name: Check every crest URL
        run: |
          python - <<'PY'
          import re, requests
          import time
          source = open("club-logos-world.js", encoding="utf-8").read()
          entries = re.findall(r'"([^"]+)"\s*:\s*\{\s*src:\s*"([^"]+)"', source)
          print(f"TOTAL CRESTS: {len(entries)}")
          def check(item):
              name, url = item
              try:
                  r = requests.get(url, timeout=25, allow_redirects=True, headers={"User-Agent":"JerseyHub-logo-check/1.0"})
                  ok = r.status_code == 200 and ("image/" in r.headers.get("content-type","").lower() or r.url.lower().endswith((".svg",".png",".jpg",".jpeg",".webp")))
                  return name, r.status_code, r.headers.get("content-type",""), r.url, ok
              except Exception as e:
                  return name, "ERROR", "", str(e), False
          results = []
          for entry in entries:
              result = check(entry)
              results.append(result)
              time.sleep(0.35)
          for name, status, ctype, final_url, ok in results:
              print(("OK  " if ok else "FAIL") + f" | {name} | {status} | {ctype} | {final_url}")
          failed = [x for x in results if not x[-1]]
          print(f"\nSUMMARY: {len(results)-len(failed)} OK / {len(failed)} FAIL")
          if any(x[1] == 404 for x in results):
              raise SystemExit(1)
          PY
