name: Audit all Vivi Jersey club products

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/vivi_club_audit.py"
      - ".github/workflows/vivi-club-audit.yml"

permissions:
  contents: write

concurrency:
  group: vivi-club-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout JerseyHub
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalogue scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Crawl all club collections and verify product options
        env:
          MAX_COLLECTIONS: "500"
        run: python scripts/vivi_club_audit.py

      - name: Upload audit files
        uses: actions/upload-artifact@v4
        with:
          name: vivi-jersey-club-audit
          path: |
            VIVI-CLUBS-AUDIT.md
            data/vivi-clubs-audit.json
            data/vivi-clubs-audit.csv
          if-no-files-found: error
          retention-days: 30

      - name: Save audit report safely to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated report outside the worktree while refreshing main.
          REPORT_DIR="$RUNNER_TEMP/vivi-audit-report"
          mkdir -p "$REPORT_DIR/data"
          cp VIVI-CLUBS-AUDIT.md "$REPORT_DIR/"
          cp data/vivi-clubs-audit.json data/vivi-clubs-audit.csv "$REPORT_DIR/data/"

          for attempt in 1 2 3 4 5; do
            echo "Tentative de sauvegarde $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            cp "$REPORT_DIR/VIVI-CLUBS-AUDIT.md" .
            cp "$REPORT_DIR/data/vivi-clubs-audit.json" "$REPORT_DIR/data/vivi-clubs-audit.csv" data/

            git add VIVI-CLUBS-AUDIT.md data/vivi-clubs-audit.json data/vivi-clubs-audit.csv
            if git diff --cached --quiet; then
              echo "Audit identique : aucun changement à committer."
              exit 0
            fi

            git commit -m "Save verified Vivi Jersey club audit"
            if git push origin HEAD:main; then
              echo "Rapport sauvegardé sur main."
              exit 0
            fi

            echo "La branche main a avancé pendant la sauvegarde ; nouvelle tentative."
            sleep 3
          done

          echo "Échec après cinq tentatives. Le rapport reste disponible dans l'artefact."
          exit 1
