<style>
.lego-gallery-page{max-width:1120px;margin:0 auto;padding:30px 22px 70px}
.lego-gallery{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:14px;align-items:start}
.lego-main{height:min(68vw,650px);min-height:300px;border:1px solid #393939;border-radius:16px;background:#111;display:grid;place-items:center;overflow:hidden}
.lego-main img{width:86%;height:86%;object-fit:contain}
.lego-thumbs{display:flex;flex-direction:column;gap:10px}
.lego-thumb{height:86px;padding:3px;border:1px solid #444;border-radius:10px;background:#191919;cursor:pointer;overflow:hidden}
.lego-thumb img{width:100%;height:100%;object-fit:contain}
.lego-thumb.active,.lego-thumb:hover{border:2px solid #e9bd54}
.lego-admin-cost{display:none;max-width:1120px;margin:18px auto 0;padding:18px 22px;border:1px solid #4b4537;border-radius:12px;background:#121212;color:#f7f7f7}
.lego-admin-cost strong{display:block;font-size:34px;font-weight:900;color:#e9bd54;margin-top:5px}
@media(max-width:650px){.lego-gallery{grid-template-columns:minmax(0,1fr) 70px}.lego-main{min-height:260px}.lego-thumb{height:65px}}
</style>

<div>Prix fournisseur</div><strong id="legoAdminPrice">— €</strong>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
document.getElementById('mobileMenu')?.addEventListener('click',()=>document.querySelector('.main-nav')?.classList.toggle('open'));
document.querySelectorAll('.lego-thumb').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.lego-thumb').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');document.getElementById('legoMainImage').src=btn.dataset.image;
}));
(async()=>{
 const cfg=window.JERSEYHUB_SUPABASE;
 if(!window.supabase||!cfg?.url||!cfg?.anonKey)return;
 const db=window.supabase.createClient(cfg.url,cfg.anonKey);
 const showAdminPrice=async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session)return;
  const {data,error}=await db.from('lego_supplier_cost').select('price_eur').eq('id',1).maybeSingle();
  if(error||!data)return;
  document.getElementById('legoAdminPrice').textContent=data.price_eur===null?'— €':new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'}).format(Number(data.price_eur));
  document.getElementById('legoAdminCost').style.display='block';
 };
 await showAdminPrice();
 db.auth.onAuthStateChange(()=>{showAdminPrice()});
})();
</script>
