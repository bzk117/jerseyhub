name: Import verified Premier League sizes from Vivi Jersey
on:
  push:
    branches: [automation/premier-league-sizes]
    paths:
      - "scripts/vivi_premier_league_sizes.py"
      - ".github/workflows/vivi-premier-league-sizes.yml"
permissions:
  contents: write
concurrency:
  group: vivi-premier-league-size-import
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/premier-league-sizes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect sizes for existing Premier League products only
        run: python scripts/vivi_premier_league_sizes.py
      - name: Upload size audit
        uses: actions/upload-artifact@v4
        with:
          name: vivi-premier-league-size-audit
          path: |
            data/vivi-premier-league-sizes.json
            data/vivi-premier-league-sizes.csv
            vivi-premier-league-sizes.js
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified size overlay and report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivi-premier-league-sizes.js data/vivi-premier-league-sizes.json data/vivi-premier-league-sizes.csv
          git commit -m "Add verified sizes to existing Premier League shirts"
          git push origin HEAD:automation/premier-league-sizes
