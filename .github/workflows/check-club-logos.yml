name: Check club crest image URLs
on:
  push:
    branches: [main]
    paths:
      - "club-logos-world.js"
      - ".github/workflows/check-club-logos.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install checker dependency
        run: python -m pip install requests
      - name: Check every crest URL
        run: |
          python - <<'PY'
          import re, requests, time
          source = open("club-logos-world.js", encoding="utf-8").read()
          entries = re.findall(r'"([^"]+)"\s*:\s*\{\s*src:\s*"([^"]+)"', source)
          print(f"TOTAL CRESTS: {len(entries)}")
          results = []
          for name, url in entries:
              try:
                  response = None
                  for attempt in range(5):
                      response = requests.get(url, timeout=25, allow_redirects=True, headers={"User-Agent":"Mozilla/5.0 JerseyHub crest checker"})
                      if response.status_code != 429:
                          break
                      time.sleep(2 ** attempt)
                  ok = response.status_code == 200 and "image/" in response.headers.get("content-type","").lower()
                  results.append((name, response.status_code, response.headers.get("content-type",""), response.url, ok))
              except Exception as exc:
                  results.append((name, "ERROR", "", str(exc), False))
              time.sleep(0.5)
          for name, status, ctype, final_url, ok in results:
              print(("OK  " if ok else "FAIL") + f" | {name} | {status} | {ctype} | {final_url}")
          failed = [item for item in results if item[1] == 404 or item[1] == "ERROR"]
          print(f"\nSUMMARY: {len(results)-len(failed)} OK / {len(failed)} confirmed failures (429 counted separately)")
          if failed:
              raise SystemExit(1)
          PY
